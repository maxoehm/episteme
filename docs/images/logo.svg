<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="glp-grad-accent" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glp-grad-glow" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Stylized G-form Epistemic TheoryNet -->
  <!-- Outer orbital/manifold arc -->
  <path d="M 38 14 C 33 7, 21 6, 14 12 C 6 19, 6 31, 14 38 C 21 44, 34 43, 39 36 C 41 33, 42 29, 42 25 L 24 25"
        stroke="url(#glp-grad-accent)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glp-glow)" />

  <!-- Internal cross-cutting theoretical relations -->
  <path d="M 14 12 L 24 25 M 14 38 L 24 25 M 24 25 L 38 14"
        stroke="url(#glp-grad-glow)"
        stroke-width="1.8"
        stroke-dasharray="2 3"
        stroke-linecap="round" />

  <!-- Epistemic Nodes (Axioms, Hypotheses, Empirical Base) -->
  <!-- Node A: Top-left Axiom -->
  <circle cx="14" cy="12" r="3.2" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.2" />
  <circle cx="14" cy="12" r="1.2" fill="#fbbf24" />

  <!-- Node B: Bottom-left Empirical Core -->
  <circle cx="14" cy="38" r="3.2" fill="#0b0f19" stroke="#0284c7" stroke-width="2.2" />
  <circle cx="14" cy="38" r="1.2" fill="#38bdf8" />

  <!-- Node C: Central Theoretical Core -->
  <circle cx="24" cy="25" r="3.8" fill="#0b0f19" stroke="#a855f7" stroke-width="2.5" />
  <circle cx="24" cy="25" r="1.5" fill="#c084fc" />

  <!-- Node D: Top-right Hypothesis -->
  <circle cx="38" cy="14" r="2.8" fill="#0b0f19" stroke="#f59e0b" stroke-width="2" />
  <circle cx="38" cy="14" r="1" fill="#fde68a" />

  <!-- Node E: Mid-right Bridge -->
  <circle cx="42" cy="25" r="2.6" fill="#0b0f19" stroke="#38bdf8" stroke-width="2" />
  <circle cx="42" cy="25" r="1" fill="#7dd3fc" />
</svg>
