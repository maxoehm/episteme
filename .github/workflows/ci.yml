name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'packages/**'
              - '!packages/episteme-studio/frontend/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            frontend:
              - 'packages/episteme-studio/frontend/**'
              - '.github/workflows/ci.yml'

  test:
    name: Backend Tests (uv & pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Pytest Suite
        run: uv run pytest --junitxml=test-results/junit.xml -v

      - name: Publish Test Report to GitHub Checks
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: 'test-results/junit.xml'
          check_name: 'Pytest Test Suite'
          fail_on_failure: true
          require_tests: true

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-junit
          path: test-results/
          retention-days: 14

  lint:
    name: Code Quality (Ruff)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Ruff Lint
        run: uvx ruff check .

      - name: Run Ruff Format Check
        run: uvx ruff format --check .

  frontend:
    name: Studio Frontend Build (TypeScript & Vite)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/episteme-studio/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: packages/episteme-studio/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript & Build
        run: npm run build
