<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLP Studio — Theory Graph Workbench</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M17.5 8C16.5 5.5 14.2 4 11.8 4C7.5 4 4 7.58 4 12C4 16.42 7.5 20 11.8 20C15.4 20 18.3 17.5 19.3 13.5H12' stroke='%233b82f6' stroke-width='2.25' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='17.5' cy='8' r='1.5' fill='%233b82f6'/%3E%3Ccircle cx='19.3' cy='13.5' r='1.6' fill='%233b82f6'/%3E%3Ccircle cx='12' cy='13.5' r='1.6' fill='%230d1117' stroke='%233b82f6' stroke-width='1.75'/%3E%3C/svg%3E" />

    <script>
      (function() {
        try {
          var stored = localStorage.getItem('glp-studio-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-app-bg text-app-text antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
