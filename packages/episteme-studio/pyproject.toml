[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "episteme-studio"
version = "0.1.0"
description = "A run-oriented workbench over the Episteme pipeline"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
    "epistemetrics",
    "episteme-pipeline",
]

[project.scripts]
episteme-studio = "episteme_studio.__main__:main"

[tool.uv.sources]
epistemetrics = { workspace = true }
episteme-pipeline = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/episteme_studio"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]
